    - id: review-and-realization
      heading: 追跡可能性をレビューし、実現へ接続する
      message: 要求から振る舞いまでの対応を保ち、意味と業務上の妥当性のレビューに依存してCMLを確定し、承認された実行可能モデルを次の実現へ渡します。
