          documentRef: realization-example
          disposition: condensed
          rationale: 画面設計の例は本文で確認します。
    - id: collaboration-interaction
      heading: 責務の構造と相互作用の順序を分けて捉える
      message: 協調では参加者と責務の構造を明示し、責務が相互作用を引き起こすとともに可能にして、その協調をシナリオのメッセージ、操作、イベントとして具体化します。
      emphasis: supporting
      coreRefs:
        steps: [collaboration-and-interaction]
        claims: [collaboration, interaction, static-and-dynamic-views]
        nodes: [collaboration-participants, collaboration-responsibility, collaboration-interaction]
        relations: [collaboration-participants-enable-interaction, collaboration-responsibility-causes-interaction, collaboration-responsibility-enables-interaction]
        flows: [collaboration-and-interaction-flow]
      navigationLabel: 協調と相互作用
      retainedPoints:
        - id: collaboration-interaction-point
          text: 責務と相互作用は同じものとして混同せず、それぞれの役割を確認します。
          coreRefs:
            steps: [collaboration-and-interaction]
            claims: [collaboration, interaction]
            nodes: [collaboration-participants, collaboration-responsibility, collaboration-interaction]
            relations: [collaboration-participants-enable-interaction, collaboration-responsibility-causes-interaction, collaboration-responsibility-enables-interaction]
            flows: [collaboration-and-interaction-flow]
      diagram:
        focusItem: collaboration-interaction-responsibility
        items:
          - id: collaboration-interaction-participants
            kind: node
            ref: collaboration-participants
          - id: collaboration-interaction-responsibility
            kind: node
