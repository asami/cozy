        flows: [application-conclusion-flow]
      navigationLabel: レビューと実現
      retainedPoints:
        - id: review-and-realization-point
          text: レビューで確定したCMLを次の実現へ渡し、対応を追跡可能に保ちます。
          coreRefs:
            steps: [application-conclusion]
            claims: [review-and-refinement, traceability, executable-model]
            nodes: [conclusion-review, conclusion-cml, conclusion-ai-proposal-decision]
