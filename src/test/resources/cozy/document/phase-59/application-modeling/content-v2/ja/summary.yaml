          rationale: 静的と動的の補足は本文で確認します。
    - id: executable-elements
      heading: イベントから操作までを実行可能に整理する
      message: イベントがサービスによる処理を引き起こすとともに可能にする関係を軸に、状態機械、サービス、操作をユースケースを実現する責務と呼出契約として組織します。
      emphasis: supporting
      coreRefs:
        steps: [executable-elements]
        claims: [event, state-machine, service-and-operation]
        nodes: [execution-event, execution-state-machine, execution-service]
        relations: [execution-event-causes-service, execution-event-enables-service, execution-state-machine-enables-service]
        flows: [executable-elements-flow]
      navigationLabel: 実行可能な要素
      retainedPoints:
        - id: executable-elements-point
          text: イベント、状態、サービス、操作をユースケース実現の責務として整理します。
          coreRefs:
            steps: [executable-elements]
            claims: [event, state-machine, service-and-operation]
            nodes: [execution-event, execution-state-machine, execution-service]
            relations: [execution-event-causes-service, execution-event-enables-service, execution-state-machine-enables-service]
            flows: [executable-elements-flow]
