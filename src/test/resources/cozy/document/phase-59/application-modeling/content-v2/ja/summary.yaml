          - id: foundation-application-model
            kind: node
            ref: root-application-model
        edges:
          - id: foundation-domain-to-application
            kind: relation
            ref: root-domain-maps-to-application
            direction: forward
      omissions:
        - id: foundation-introduction-condensed
          documentKind: block
          documentRef: introduction-paragraph
          disposition: condensed
          rationale: 導入の詳細は本文で確認します。
    - id: use-case-model
      heading: ユースケースから実現モデルを構成する
      message: シナリオを直接プログラムへ進めず、利用者の目的をアプリケーション内部の実現モデルへ対応付けます。
      emphasis: primary
      coreRefs:
        steps: [use-case-realization]
        claims: [use-case-as-starting-point, use-case-realization, ui-and-application-boundary]
        nodes: [realization-scenario, realization-model]
        relations: [realization-scenario-maps-to-model]
        flows: [use-case-realization-flow]
      navigationLabel: ユースケース実現
      retainedPoints:
        - id: use-case-model-point
          text: シナリオと実現モデルを対応付けてから実装の検討へ進みます。
          coreRefs:
            steps: [use-case-realization]
            claims: [use-case-as-starting-point, use-case-realization]
            nodes: [realization-scenario, realization-model]
            relations: [realization-scenario-maps-to-model]
            flows: [use-case-realization-flow]
      diagram:
        focusItem: use-case-model-realization
        items:
          - id: use-case-model-scenario
            kind: node
            ref: realization-scenario
          - id: use-case-model-realization
