    - id: foundation-purpose
      heading: ドメインの意味を利用目的の実現へつなぐ
      message: アプリケーションモデリングは、ドメインモデルを、利用者の目的を実現するアプリケーションモデルへ対応付けます。
      emphasis: primary
      coreRefs:
        steps: [application-modeling, application-foundation, use-case-realization]
        claims: [series-position, series-continuity, application-modeling-purpose, domain-and-application-modeling]
        nodes: [root-domain-model, root-application-model]
        relations: [root-domain-maps-to-application]
        flows: [application-modeling-flow]
      navigationLabel: 基礎と目的
      retainedPoints:
        - id: foundation-purpose-point
          text: ドメインの意味を利用者の目的へ対応付けることが出発点です。
          coreRefs:
            steps: [application-modeling]
            claims: [series-position, series-continuity]
            nodes: [root-domain-model, root-application-model]
            relations: [root-domain-maps-to-application]
            flows: [application-modeling-flow]
      diagram:
        focusItem: foundation-application-model
