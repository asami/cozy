summary:
  title: SimpleModeling 第9回 アプリケーションモデリング：要約
  units:
    - id: application-overview
      overview:
        stepRef: application-modeling
      heading: アプリケーションモデリングの全体像
      message: ドメインの意味を利用者の目的の実現へ対応付け、基礎となる見方、ユースケース実現、レビューと実現への接続を区別して全体を捉えます。
      emphasis: primary
      coreRefs:
        steps: [application-modeling, application-foundation, use-case-realization, application-conclusion]
        claims: [series-position, series-continuity]
        nodes: [root-domain-model, root-application-model]
        relations: [root-domain-maps-to-application]
        flows: [application-modeling-flow]
      navigationLabel: 全体像
      retainedPoints:
        - id: overview-series-position
          text: 第8回のドメインモデリングで整理した意味と構造を、ユースケースの実現へつなぎます。
          coreRefs:
            steps: [application-modeling]
            claims: [series-position, series-continuity]
            nodes: [root-domain-model, root-application-model]
            relations: [root-domain-maps-to-application]
            flows: []
        - id: overview-step-dependencies
          text: 基礎となる見方を土台にユースケース実現を整理し、その実現を踏まえてレビューへ接続します。
          coreRefs:
            steps: [application-foundation, use-case-realization, application-conclusion]
            claims: []
            nodes: []
            relations: []
            flows: [application-modeling-flow]
      diagram:
        items:
          - id: overview-domain-model
            kind: node
            ref: root-domain-model
          - id: overview-application-model
            kind: node
            ref: root-application-model
          - id: overview-conclusion
            kind: step
            ref: application-conclusion
          - id: overview-realization
            kind: step
            ref: use-case-realization
          - id: overview-foundation
