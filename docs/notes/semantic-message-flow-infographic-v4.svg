<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150"><style>
text{font-family:'Noto Sans','Noto Sans CJK JP',sans-serif;fill:#172033}
.title{font-size:40px;font-weight:800}.tag{font-size:17px;fill:#526070}.section{font-size:21px;font-weight:750}.label{font-size:16px;font-weight:700}
.body{font-size:15px;fill:#435066}.small{font-size:13px;fill:#526070}.tiny{font-size:12px;fill:#68758a}.iocText{font-size:16px;font-weight:800;fill:#c94b54}
.card{fill:#fff;stroke:#c6ced8;stroke-width:1.3}.component{fill:#f8fafc;stroke:#7c899a;stroke-width:1.4}.rule{font-size:18px;font-weight:700}
</style><rect width="100%" height="100%" fill="#f7f9fb"/><rect x="35" y="30" width="1530" height="120" rx="22" fill="#203c5b"/><text x="75" y="83" class="title" style="fill:white">Semantic Message Flow</text><text x="75" y="118" class="tag" style="fill:#dbe7f3">Meaning-first component communication notation — Cozy / CML reference</text><text x="1490" y="84" text-anchor="end" class="label" style="fill:white">Grammar v4</text><rect x="35" y="175" width="500" height="235" rx="16" class="card"/><rect x="35" y="175" width="500" height="48" rx="16" fill="#2e6fbb" opacity=".12"/><text x="57" y="207" class="section">Core principles</text><text x="65" y="245" class="body">• 1 relationship = 1 line</text><text x="65" y="277" class="body">• Model semantic flow, not request/response mechanics</text><text x="65" y="309" class="body">• Control and Data share one relationship line</text><text x="65" y="341" class="body">• Notation must remain meaningful in monochrome</text><text x="65" y="373" class="body">• Use ordinary Draw Editor primitives</text><rect x="555" y="175" width="1010" height="235" rx="16" class="card"/><rect x="555" y="175" width="1010" height="48" rx="16" fill="#29906f" opacity=".12"/><text x="577" y="207" class="section">Endpoint grammar — arrowhead only</text><line x1="620" y1="280" x2="770" y2="280" fill="none" stroke="#26364a" stroke-width="3"/><polygon points="783.0,280.0 770.0,286.0 770.0,274.0" fill="#26364a"/><text x="695" y="322" text-anchor="middle" class="rule">Control + Data</text><text x="695" y="348" text-anchor="middle" class="small">Control and data arrive</text><line x1="930" y1="280" x2="1080" y2="280" fill="none" stroke="#26364a" stroke-width="3"/><path d="M 1080.0 286.0 L 1093.0 280.0 L 1080.0 274.0" fill="none" stroke="#26364a" stroke-width="2.1"/><text x="1005" y="322" text-anchor="middle" class="rule">Control only</text><text x="1005" y="348" text-anchor="middle" class="small">Control arrives</text><line x1="1240" y1="280" x2="1390" y2="280" fill="none" stroke="#26364a" stroke-width="3"/><polygon points="1403.0,280.0 1390.0,286.0 1390.0,274.0" fill="white" stroke="#26364a" stroke-width="1.8"/><text x="1315" y="322" text-anchor="middle" class="rule">Data only</text><text x="1315" y="348" text-anchor="middle" class="small">Data arrives</text><text x="585" y="388" class="small">Important: Data-only uses a normal single line. Only the arrowhead is hollow.</text><rect x="35" y="435" width="760" height="300" rx="16" class="card"/><rect x="35" y="435" width="760" height="48" rx="16" fill="#7654a8" opacity=".12"/><text x="57" y="467" class="section">Relationship attributes — orthogonal</text><text x="65" y="505" class="label">Communication timing</text><line x1="80" y1="550" x2="340" y2="550" fill="none" stroke="#26364a" stroke-width="3"/><path d="M 340.0 556.0 L 353.0 550.0 L 340.0 544.0" fill="none" stroke="#26364a" stroke-width="2.1"/><text x="380" y="556" class="body">Synchronous = solid line</text><line x1="80" y1="605" x2="340" y2="605" fill="none" stroke="#2e6fbb" stroke-width="3" stroke-dasharray="11 9"/><path d="M 340.0 611.0 L 353.0 605.0 L 340.0 599.0" fill="none" stroke="#2e6fbb" stroke-width="2.1"/><text x="380" y="611" class="body">Asynchronous = dashed line</text><text x="65" y="670" class="label">Continuation / IoC</text><line x1="80" y1="710" x2="340" y2="710" fill="none" stroke="#c94b54" stroke-width="3"/><path d="M 340.0 716.0 L 353.0 710.0 L 340.0 704.0" fill="none" stroke="#c94b54" stroke-width="2.1"/><circle cx="210.0" cy="710.0" r="15" fill="white" stroke="#c94b54" stroke-width="2"/><text x="210.0" y="715.0" text-anchor="middle" class="iocText">I</text><text x="380" y="716" class="body">IoC = circled I on the same line</text><rect x="815" y="435" width="750" height="300" rx="16" class="card"/><rect x="815" y="435" width="750" height="48" rx="16" fill="#c65d77" opacity=".12"/><text x="837" y="467" class="section">Combinations</text><line x1="870" y1="525" x2="1120" y2="525" fill="none" stroke="#c94b54" stroke-width="3"/><path d="M 1120.0 531.0 L 1133.0 525.0 L 1120.0 519.0" fill="none" stroke="#c94b54" stroke-width="2.1"/><circle cx="995.0" cy="525.0" r="15" fill="white" stroke="#c94b54" stroke-width="2"/><text x="995.0" y="530.0" text-anchor="middle" class="iocText">I</text><text x="1160" y="531" class="body">Synchronous IoC</text><line x1="870" y1="595" x2="1120" y2="595" fill="none" stroke="#c94b54" stroke-width="3" stroke-dasharray="11 9"/><path d="M 1120.0 601.0 L 1133.0 595.0 L 1120.0 589.0" fill="none" stroke="#c94b54" stroke-width="2.1"/><circle cx="995.0" cy="595.0" r="15" fill="white" stroke="#c94b54" stroke-width="2"/><text x="995.0" y="600.0" text-anchor="middle" class="iocText">I</text><text x="1160" y="601" class="body">Asynchronous IoC</text><text x="855" y="660" class="body">Timing and IoC are independent dimensions.</text><text x="855" y="692" class="body">Color is supplementary only; solid/dashed and Ⓘ carry meaning.</text><rect x="35" y="760" width="1530" height="270" rx="16" class="card"/><rect x="35" y="760" width="1530" height="48" rx="16" fill="#c38b22" opacity=".12"/><text x="57" y="792" class="section">Reference relationships</text><rect x="90" y="845" width="190" height="70" rx="10" class="component"/><text x="185.0" y="886.0" text-anchor="middle" class="label">Human</text><rect x="500" y="845" width="250" height="70" rx="10" class="component"/><text x="625.0" y="886.0" text-anchor="middle" class="label">Control Center</text><line x1="295" y1="880" x2="485" y2="880" fill="none" stroke="#26364a" stroke-width="3"/><polygon points="282.0,880.0 295.0,874.0 295.0,886.0" fill="white" stroke="#26364a" stroke-width="1.8"/><path d="M 485.0 886.0 L 498.0 880.0 L 485.0 874.0" fill="none" stroke="#26364a" stroke-width="2.1"/><text x="390.0" y="865.0" text-anchor="middle" class="tiny">operate / observe</text><text x="90" y="948" class="small">Human receives information (Data).</text><text x="500" y="948" class="small">Control Center receives Human control.</text><rect x="860" y="845" width="220" height="70" rx="10" class="component"/><text x="970.0" y="886.0" text-anchor="middle" class="label">sm-workflow</text><rect x="1300" y="845" width="170" height="70" rx="10" class="component"/><text x="1385.0" y="886.0" text-anchor="middle" class="label">Codex</text><line x1="1095" y1="880" x2="1285" y2="880" fill="none" stroke="#c94b54" stroke-width="3"/><polygon points="1082.0,880.0 1095.0,874.0 1095.0,886.0" fill="white" stroke="#c94b54" stroke-width="1.8"/><polygon points="1298.0,880.0 1285.0,886.0 1285.0,874.0" fill="#c94b54"/><circle cx="1190.0" cy="880.0" r="15" fill="white" stroke="#c94b54" stroke-width="2"/><text x="1190.0" y="885.0" text-anchor="middle" class="iocText">I</text><text x="1190.0" y="865.0" text-anchor="middle" class="tiny">delegated work</text><text x="860" y="948" class="small">Final result/data returns to sm-workflow.</text><text x="1300" y="948" class="small">Delegated Control + Data arrive at Codex.</text><text x="75" y="995" class="body">Continuation callbacks and end/result are protocol details inside one IoC relationship — do not expand them into extra architectural lines.</text><rect x="35" y="1055" width="1530" height="60" rx="14" fill="#e9eef4"/><text x="60" y="1092" class="small">Drawing constraint: line · dashed line · standard arrowhead · circle · text. Compatible with OmniGraffle, draw.io, PowerPoint and ordinary SVG editors.</text></svg>