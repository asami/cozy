<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1030" viewBox="0 0 1400 1030"><style>
text{font-family:'Noto Sans','Noto Sans CJK JP',sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.sub{font-size:15px;fill:#526070}
.h{font-size:21px;font-weight:700}.label{font-size:16px;font-weight:700}.small{font-size:14px;fill:#526070}.tiny{font-size:12px;fill:#68758a}
.panel{fill:#fbfcfd;stroke:#c4ccd7;stroke-width:1.4}.card{fill:white;stroke:#8794a6;stroke-width:1.3}
</style><rect width="100%" height="100%" fill="white"/><text x="50" y="55" class="title">Semantic Message Flow — Grammar v4</text><text x="50" y="83" class="sub">Ordinary drawing-editor primitives; semantics remain readable without color.</text><rect x="50" y="115" width="1300" height="185" rx="14" class="panel"/><text x="75" y="150" class="h">1. Endpoint grammar</text><line x1="150" y1="205" x2="300" y2="205" fill="none" stroke="#26364a" stroke-width="2.7"/><polygon points="312.0,205.0 300.0,210.5 300.0,199.5" fill="#26364a"/><text x="225" y="247" text-anchor="middle" class="label">Control + Data</text><line x1="500" y1="205" x2="650" y2="205" fill="none" stroke="#26364a" stroke-width="2.7"/><path d="M 650.0 210.5 L 662.0 205.0 L 650.0 199.5" fill="none" stroke="#26364a" stroke-width="2.1"/><text x="575" y="247" text-anchor="middle" class="label">Control only</text><line x1="850" y1="205" x2="1000" y2="205" fill="none" stroke="#26364a" stroke-width="2.7"/><polygon points="1012.0,205.0 1000.0,210.5 1000.0,199.5" fill="white" stroke="#26364a" stroke-width="1.8"/><text x="925" y="247" text-anchor="middle" class="label">Data only</text><text x="75" y="280" class="small">Line and arrow are separate primitives. The endpoint symbol states what arrives at that endpoint.</text><rect x="50" y="325" width="1300" height="180" rx="14" class="panel"/><text x="75" y="360" class="h">2. One relationship = one line</text><rect x="120" y="400" width="220" height="65" rx="10" class="card"/><text x="230.0" y="429" text-anchor="middle" class="label">Component A</text><rect x="1060" y="400" width="220" height="65" rx="10" class="card"/><text x="1170.0" y="429" text-anchor="middle" class="label">Component B</text><line x1="354" y1="432" x2="1046" y2="432" fill="none" stroke="#26364a" stroke-width="2.7"/><polygon points="342.0,432.0 354.0,426.5 354.0,437.5" fill="white" stroke="#26364a" stroke-width="1.8"/><path d="M 1046.0 437.5 L 1058.0 432.0 L 1046.0 426.5" fill="none" stroke="#26364a" stroke-width="2.1"/><text x="700.0" y="417.0" text-anchor="middle" class="tiny">Control A → B / Data B → A</text><text x="75" y="485" class="small">Control and data for the same semantic relationship share one line. Endpoint symbols do not overlap component shapes.</text><rect x="50" y="530" width="1300" height="260" rx="14" class="panel"/><text x="75" y="565" class="h">3. Orthogonal relationship attributes</text><text x="100" y="605" class="label">Communication timing</text><line x1="120" y1="645" x2="430" y2="645" fill="none" stroke="#26364a" stroke-width="2.7"/><path d="M 430.0 650.5 L 442.0 645.0 L 430.0 639.5" fill="none" stroke="#26364a" stroke-width="2.1"/><text x="470" y="650" class="small">Synchronous — solid line</text><line x1="120" y1="690" x2="430" y2="690" fill="none" stroke="#2e6fbb" stroke-width="2.7" stroke-dasharray="10 8"/><path d="M 430.0 695.5 L 442.0 690.0 L 430.0 684.5" fill="none" stroke="#2e6fbb" stroke-width="2.1"/><text x="470" y="695" class="small">Asynchronous — dashed line</text><text x="760" y="605" class="label">Continuation / IoC</text><line x1="780" y1="645" x2="1090" y2="645" fill="none" stroke="#c94b54" stroke-width="2.7"/><path d="M 1090.0 650.5 L 1102.0 645.0 L 1090.0 639.5" fill="none" stroke="#c94b54" stroke-width="2.1"/><circle cx="935.0" cy="645.0" r="14" fill="white" stroke="#c94b54" stroke-width="2"/><text x="935.0" y="650.0" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#c94b54">I</text><text x="1130" y="650" class="small">Synchronous IoC</text><line x1="780" y1="710" x2="1090" y2="710" fill="none" stroke="#c94b54" stroke-width="2.7" stroke-dasharray="10 8"/><path d="M 1090.0 715.5 L 1102.0 710.0 L 1090.0 704.5" fill="none" stroke="#c94b54" stroke-width="2.1"/><circle cx="935.0" cy="710.0" r="14" fill="white" stroke="#c94b54" stroke-width="2"/><text x="935.0" y="715.0" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#c94b54">I</text><text x="1130" y="715" class="small">Asynchronous IoC</text><text x="100" y="765" class="small">Solid/dashed carries timing semantics. Ⓘ carries IoC semantics. Color is supplementary only.</text><rect x="50" y="815" width="1300" height="160" rx="14" class="panel"/><text x="75" y="850" class="h">4. Reference examples</text><rect x="100" y="885" width="180" height="65" rx="10" class="card"/><text x="190.0" y="914" text-anchor="middle" class="label">Human</text><rect x="480" y="885" width="240" height="65" rx="10" class="card"/><text x="600.0" y="914" text-anchor="middle" class="label">Control Center</text><line x1="294" y1="917" x2="466" y2="917" fill="none" stroke="#26364a" stroke-width="2.7"/><polygon points="282.0,917.0 294.0,911.5 294.0,922.5" fill="white" stroke="#26364a" stroke-width="1.8"/><path d="M 466.0 922.5 L 478.0 917.0 L 466.0 911.5" fill="none" stroke="#26364a" stroke-width="2.1"/><text x="380.0" y="902.0" text-anchor="middle" class="tiny">operate / observe</text><rect x="790" y="885" width="220" height="65" rx="10" class="card"/><text x="900.0" y="914" text-anchor="middle" class="label">sm-workflow</text><rect x="1130" y="885" width="150" height="65" rx="10" class="card"/><text x="1205.0" y="914" text-anchor="middle" class="label">Codex</text><line x1="1024" y1="917" x2="1116" y2="917" fill="none" stroke="#c94b54" stroke-width="2.7"/><polygon points="1012.0,917.0 1024.0,911.5 1024.0,922.5" fill="white" stroke="#c94b54" stroke-width="1.8"/><polygon points="1128.0,917.0 1116.0,922.5 1116.0,911.5" fill="#c94b54"/><circle cx="1070.0" cy="917.0" r="14" fill="white" stroke="#c94b54" stroke-width="2"/><text x="1070.0" y="922.0" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#c94b54">I</text><text x="1070.0" y="902.0" text-anchor="middle" class="tiny">delegated work</text><text x="50" y="1010" class="tiny">Constraint: the reference notation must be reproducible with ordinary Draw Editor primitives (line, dashed line, standard arrowheads, circle, text).</text></svg>