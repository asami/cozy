<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1030" viewBox="0 0 1400 1030"><style>
text{font-family:'Noto Sans','Noto Sans CJK JP',sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.sub{font-size:15px;fill:#526070}
.h{font-size:21px;font-weight:700}.label{font-size:16px;font-weight:700}.small{font-size:14px;fill:#526070}.tiny{font-size:12px;fill:#68758a}
.panel{fill:#fbfcfd;stroke:#c4ccd7;stroke-width:1.4}.card{fill:white;stroke:#8794a6;stroke-width:1.3}</style><rect width="100%" height="100%" fill="white"/>
<text x="50" y="55" class="title">Semantic Message Flow — Grammar v4</text><text x="50" y="83" class="sub">Ordinary drawing-editor primitives; semantics remain readable without color.</text>
<rect x="50" y="115" width="1300" height="185" rx="14" class="panel"/><text x="75" y="150" class="h">1. Endpoint grammar</text>
<line x1="150" y1="205" x2="300" y2="205" stroke="#26364a" stroke-width="2.7"/><polygon points="312,205 300,210.5 300,199.5" fill="#26364a"/><text x="225" y="247" text-anchor="middle" class="label">Control + Data</text>
<line x1="500" y1="205" x2="650" y2="205" stroke="#26364a" stroke-width="2.7"/><path d="M650 210.5 L662 205 L650 199.5" fill="none" stroke="#26364a" stroke-width="2.1"/><text x="575" y="247" text-anchor="middle" class="label">Control only</text>
<line x1="850" y1="205" x2="1000" y2="205" stroke="#26364a" stroke-width="2.7"/><polygon points="1012,205 1000,210.5 1000,199.5" fill="white" stroke="#26364a" stroke-width="1.8"/><text x="925" y="247" text-anchor="middle" class="label">Data only</text>
<text x="75" y="280" class="small">Line and arrow are separate primitives. The endpoint symbol states what arrives at that endpoint.</text>
<rect x="50" y="325" width="1300" height="180" rx="14" class="panel"/><text x="75" y="360" class="h">2. One relationship = one line</text>
<rect x="120" y="400" width="220" height="65" rx="10" class="card"/><text x="230" y="429" text-anchor="middle" class="label">Component A</text><rect x="1060" y="400" width="220" height="65" rx="10" class="card"/><text x="1170" y="429" text-anchor="middle" class="label">Component B</text>
<line x1="354" y1="432" x2="1046" y2="432" stroke="#26364a" stroke-width="2.7"/><polygon points="342,432 354,426.5 354,437.5" fill="white" stroke="#26364a" stroke-width="1.8"/><path d="M1046 437.5 L1058 432 L1046 426.5" fill="none" stroke="#26364a" stroke-width="2.1"/><text x="700" y="417" text-anchor="middle" class="tiny">Control A → B / Data B → A</text>
<text x="75" y="485" class="small">Control and data for the same semantic relationship share one line. Endpoint symbols do not overlap component shapes.</text>
<rect x="50" y="530" width="1300" height="260" rx="14" class="panel"/><text x="75" y="565" class="h">3. Orthogonal relationship attributes</text>
<text x="100" y="605" class="label">Communication timing</text><line x1="120" y1="645" x2="430" y2="645" stroke="#26364a" stroke-width="2.7"/><path d="M430 650.5 L442 645 L430 639.5" fill="none" stroke="#26364a" stroke-width="2.1"/><text x="470" y="650" class="small">Synchronous — solid line</text>
<line x1="120" y1="690" x2="430" y2="690" stroke="#2e6fbb" stroke-width="2.7" stroke-dasharray="10 8"/><path d="M430 695.5 L442 690 L430 684.5" fill="none" stroke="#2e6fbb" stroke-width="2.1"/><text x="470" y="695" class="small">Asynchronous — dashed line</text>
<text x="760" y="605" class="label">Continuation / IoC</text><line x1="780" y1="645" x2="1090" y2="645" stroke="#c94b54" stroke-width="2.7"/><path d="M1090 650.5 L1102 645 L1090 639.5" fill="none" stroke="#c94b54" stroke-width="2.1"/><circle cx="935" cy="645" r="14" fill="white" stroke="#c94b54" stroke-width="2"/><text x="935" y="650" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#c94b54">I</text><text x="1130" y="650" class="small">Synchronous IoC</text>
<line x1="780" y1="710" x2="1090" y2="710" stroke="#c94b54" stroke-width="2.7" stroke-dasharray="10 8"/><path d="M1090 715.5 L1102 710 L1090 704.5" fill="none" stroke="#c94b54" stroke-width="2.1"/><circle cx="935" cy="710" r="14" fill="white" stroke="#c94b54" stroke-width="2"/><text x="935" y="715" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#c94b54">I</text><text x="1130" y="715" class="small">Asynchronous IoC</text><text x="100" y="765" class="small">Solid/dashed carries timing semantics. Ⓘ carries IoC semantics. Color is supplementary only.</text>
<rect x="50" y="815" width="1300" height="160" rx="14" class="panel"/><text x="75" y="850" class="h">4. Reference examples</text>
<rect x="100" y="885" width="180" height="65" rx="10" class="card"/><text x="190" y="914" text-anchor="middle" class="label">Human</text><rect x="480" y="885" width="240" height="65" rx="10" class="card"/><text x="600" y="914" text-anchor="middle" class="label">Control Center</text>
<line x1="294" y1="917" x2="466" y2="917" stroke="#26364a" stroke-width="2.7"/><polygon points="282,917 294,911.5 294,922.5" fill="white" stroke="#26364a" stroke-width="1.8"/><path d="M466 922.5 L478 917 L466 911.5" fill="none" stroke="#26364a" stroke-width="2.1"/>
<rect x="790" y="885" width="220" height="65" rx="10" class="card"/><text x="900" y="914" text-anchor="middle" class="label">sm-workflow</text><rect x="1130" y="885" width="150" height="65" rx="10" class="card"/><text x="1205" y="914" text-anchor="middle" class="label">Codex</text>
<line x1="1024" y1="917" x2="1116" y2="917" stroke="#c94b54" stroke-width="2.7"/><polygon points="1012,917 1024,911.5 1024,922.5" fill="white" stroke="#c94b54" stroke-width="1.8"/><polygon points="1128,917 1116,922.5 1116,911.5" fill="#c94b54"/><circle cx="1070" cy="917" r="14" fill="white" stroke="#c94b54" stroke-width="2"/><text x="1070" y="922" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#c94b54">I</text>
<text x="50" y="1010" class="tiny">Constraint: reproducible with ordinary Draw Editor primitives (line, dashed line, standard arrowheads, circle, text).</text></svg>