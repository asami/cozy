.external{fill:#f5f6f8;stroke:#778396}.line{fill:none;stroke-width:2.4}.sync{stroke:#26364a}.ioc{stroke:#c94b54}.note{fill:#fffdf3;stroke:#c5aa4b}
</style><rect width="100%" height="100%" fill="white"/>
<text x="40" y="52" class="title">1. Overall Architecture</text><text x="40" y="78" class="sub">Textus AI Operations — semantic message-flow view</text>
<rect x="520" y="105" width="360" height="75" rx="12" class="human"/><text x="700" y="135" text-anchor="middle" class="label">Human</text><text x="700" y="157" text-anchor="middle" class="small">uses Control Center and Slack</text>
<rect x="75" y="235" width="330" height="90" rx="12" class="mgmt"/><text x="240" y="265" text-anchor="middle" class="label">textus-control-center</text><text x="240" y="287" text-anchor="middle" class="small">runtime management / dashboard</text>
<rect x="515" y="235" width="370" height="90" rx="12" class="box"/><text x="700" y="265" text-anchor="middle" class="label">Slack</text><text x="700" y="287" text-anchor="middle" class="small">human ↔ AI communication</text>
<line x1="610" y1="180" x2="350" y2="235" class="line sync"/><polygon points="622.72,177.31 611.24,185.87 608.76,174.13" fill="white" stroke="#26364a" stroke-width="1.7"/><path d="M348.76 229.13 L337.28 237.69 L351.24 240.87" fill="none" stroke="#26364a" stroke-width="2"/>
