<rect x="90" y="625" width="245" height="75" rx="12" class="knowledge"/><text x="212.5" y="655" text-anchor="middle" class="label">TKL</text><text x="212.5" y="677" text-anchor="middle" class="small">Knowledge Lake access</text>
<rect x="90" y="730" width="245" height="75" rx="12" class="external"/><text x="212.5" y="760" text-anchor="middle" class="label">TEAI</text><text x="212.5" y="782" text-anchor="middle" class="small">external-system integration</text>
<line x1="555" y1="455" x2="335" y2="662" class="line sync"/><polygon points="564.47,446.09 559.11,459.37 550.89,450.63" fill="white" stroke="#26364a" stroke-width="1.7"/><path d="M330.89 657.63 L325.53 670.91 L339.11 666.37" fill="none" stroke="#26364a" stroke-width="2"/>
<line x1="555" y1="475" x2="335" y2="767" class="line sync"/><polygon points="562.82,464.62 559.79,478.61 550.21,471.39" fill="white" stroke="#26364a" stroke-width="1.7"/><path d="M330.21 763.39 L327.18 777.38 L339.79 770.61" fill="none" stroke="#26364a" stroke-width="2"/>
<line x1="350" y1="325" x2="500" y2="575" class="line sync"/><polygon points="343.31,313.85 354.80,321.40 344.51,327.57" fill="white" stroke="#26364a" stroke-width="1.7"/><path d="M499.65 567.99 L506.69 586.15 L489.36 576.35" fill="none" stroke="#26364a" stroke-width="2"/><text x="425" y="438" text-anchor="middle" class="tiny">manage / status</text>
<rect x="390" y="710" width="570" height="95" rx="12" class="note"/><text x="420" y="742" class="label">Key boundaries</text><text x="420" y="768" class="small">sm-workflow connects only to Orchestrator and Codex; it does not use TKL, TEAI or Knowledge Lake.</text><text x="420" y="792" class="small">TKL and TEAI are controlled by OpenClaw. Orchestrator has no direct Codex connection.</text>
<rect x="40" y="835" width="1320" height="70" rx="10" class="box"/><text x="58" y="859" class="small">Message Flow — one relationship = one line; protocol callbacks/end are absorbed into the IoC relationship</text>
<line x1="330" y1="857" x2="400" y2="857" class="line sync"/><polygon points="413,857 400,863 400,851" fill="#26364a"/><text x="410" y="862" class="tiny">Control + Data</text>
<line x1="530" y1="857" x2="600" y2="857" class="line sync"/><path d="M600 863 L613 857 L600 851" fill="none" stroke="#26364a" stroke-width="2"/><text x="610" y="862" class="tiny">Control only</text>
<line x1="730" y1="857" x2="800" y2="857" class="line sync"/><polygon points="813,857 800,863 800,851" fill="white" stroke="#26364a" stroke-width="1.7"/><text x="810" y="862" class="tiny">Data only</text>
<line x1="930" y1="857" x2="1030" y2="857" class="line ioc"/><polygon points="1043,857 1030,863 1030,851" fill="#c94b54"/><circle cx="980" cy="857" r="13" fill="white" stroke="#c94b54" stroke-width="2"/><text x="980" y="862" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#c94b54">I</text><text x="1040" y="862" class="tiny">Continuation / IoC</text>
</svg>