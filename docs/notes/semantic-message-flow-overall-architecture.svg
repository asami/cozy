<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930"><style>
text{font-family:'Noto Sans','Noto Sans CJK JP',sans-serif;fill:#172033}
.title{font-size:32px;font-weight:700}.sub{font-size:15px;fill:#526070}.label{font-size:16px;font-weight:700}
.small{font-size:13px;fill:#526070}.tiny{font-size:11px;fill:#68758a}
.box{fill:#fff;stroke:#6b7a90;stroke-width:1.5}.human{fill:#f8fafc}.mgmt{fill:#e8f5f2;stroke:#298c7e}
.orch{fill:#f4eefa;stroke:#7b52ab}.dots{fill:#f2edfb;stroke:#7952b3}.claw{fill:#ecf8ef;stroke:#31945b}
