<line x1="570" y1="600" x2="280" y2="495" class="line ioc"/><polygon points="582.22,604.43 567.96,605.64 572.04,594.36" fill="white" stroke="#c94b54" stroke-width="1.7"/><polygon points="267.78,490.57 282.04,489.36 277.96,500.64" fill="#c94b54"/><circle cx="425" cy="547.5" r="13" fill="white" stroke="#c94b54" stroke-width="2"/><text x="425" y="552.5" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#c94b54">I</text>
<line x1="700" y1="575" x2="700" y2="495" class="line ioc"/><polygon points="700,588 694,575 706,575" fill="white" stroke="#c94b54" stroke-width="1.7"/><polygon points="700,482 706,495 694,495" fill="#c94b54"/><circle cx="700" cy="535" r="13" fill="white" stroke="#c94b54" stroke-width="2"/><text x="700" y="540" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#c94b54">I</text>
<rect x="1000" y="550" width="300" height="100" rx="12" class="workflow"/><text x="1150" y="580" text-anchor="middle" class="label">sm-workflow</text><text x="1150" y="602" text-anchor="middle" class="small">development workflow only</text>
<line x1="935" y1="625" x2="1000" y2="600" class="line sync"/><polygon points="922.87,629.67 932.85,619.40 937.15,630.60" fill="white" stroke="#26364a" stroke-width="1.7"/><path d="M1002.15 605.60 L1012.13 595.33 L997.85 594.40" fill="none" stroke="#26364a" stroke-width="2"/>
<rect x="1050" y="705" width="200" height="70" rx="12" class="tool"/><text x="1150" y="735" text-anchor="middle" class="label">Codex</text><text x="1150" y="757" text-anchor="middle" class="small">development worker</text>
