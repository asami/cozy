<rect x="135" y="400" width="280" height="95" rx="12" class="dots"/><text x="275" y="430" text-anchor="middle" class="label">Dots (Astra)</text><text x="275" y="452" text-anchor="middle" class="small">planning / design / continuous review</text>
<rect x="555" y="400" width="290" height="95" rx="12" class="claw"/><text x="700" y="430" text-anchor="middle" class="label">OpenClaw</text><text x="700" y="452" text-anchor="middle" class="small">Local LLM / execution / integration</text>
<line x1="610" y1="325" x2="280" y2="400" class="line sync"/><polygon points="622.68,322.12 611.33,330.85 608.67,319.15" fill="white" stroke="#26364a" stroke-width="1.7"/><path d="M278.67 394.15 L267.32 402.88 L281.33 405.85" fill="none" stroke="#26364a" stroke-width="2"/>
